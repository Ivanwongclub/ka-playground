# KA Playground — local development stack (S00 STEP 2).
# Staging variant (2.14) and tagged-image deploy (2.26) land in S00 STEP 6.
name: kap

services:
  app:
    build: ./api
    volumes:
      - ./api:/var/www/api
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: kap
      DB_USERNAME: kap
      DB_PASSWORD: kap_local_only
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'pgrep php-fpm || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5

  horizon:
    build: ./api
    command: php artisan horizon
    volumes:
      - ./api:/var/www/api
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: kap
      DB_USERNAME: kap
      DB_PASSWORD: kap_local_only
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'php artisan horizon:status | grep -q running']
      interval: 15s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    ports:
      - '8080:80'
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api:/var/www/api:ro
      - ./web/dist:/usr/share/nginx/html:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/ || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kap
      POSTGRES_USER: kap
      POSTGRES_PASSWORD: kap_local_only
    ports:
      - '54329:5432' # host access for the phpunit suite (kap_test)
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kap -d kap']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
