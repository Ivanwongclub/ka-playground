# CI runs the SAME commands as the S00 exit gate — if CI and the gate can
# disagree, the gate is decorative (Leo, S00 STEP 6).
# Note: no clamav service here (large signature download per run); the four
# real-clamd integration tests skip VISIBLY in CI and run locally + on staging.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kap
          POSTGRES_PASSWORD: kap_local_only
          POSTGRES_DB: kap
        ports:
          - 54329:5432 # same host port as local, so phpunit.xml works unchanged
        options: >-
          --health-cmd "pg_isready -U kap -d kap"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, gd, exif, redis
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate --force

      - name: Create test database
        run: PGPASSWORD=kap_local_only psql -h 127.0.0.1 -p 54329 -U kap -d kap -c 'CREATE DATABASE kap_test OWNER kap;'

      - name: Cache ClamAV signature database
        uses: actions/cache@v4
        with:
          path: clamav-db
          key: clamav-db-${{ github.run_number }}
          restore-keys: clamav-db-

      - name: Start ClamAV (cached signatures + KAP test signature)
        run: |
          mkdir -p clamav-db
          cp deploy/clamav/kap-test.ndb clamav-db/kap-test.ndb
          sudo chown -R 100:101 clamav-db || true
          docker run -d --name clamav -p 3310:3310 \
            -v "$PWD/clamav-db:/var/lib/clamav" clamav/clamav-debian:latest
          for i in $(seq 1 60); do
            if docker exec clamav clamdscan --ping 1 2>/dev/null; then echo ready; break; fi
            sleep 5
          done
          docker exec clamav clamdscan --ping 1 || { docker logs clamav | tail -20; exit 1; }
          printf 'KAP-CUSTOM-TEST-SIGNATURE-6a8f2c' | docker exec -i clamav clamdscan - | head -1

      - name: Migration gate (2.15)
        working-directory: api
        run: |
          php artisan migrate --force
          php artisan migrate --pretend

      - name: API tests (incl. the four real-clamd tests — must EXECUTE, not skip)
        working-directory: api
        env:
          CLAMAV_HOST: 127.0.0.1
          CLAMAV_PORT: 3310
        run: |
          php artisan test
          php artisan test --filter=ClamAvIntegrationTest 2>&1 | tee clamd-tests.log
          if grep -qi 'skipped' clamd-tests.log; then
            echo 'FAIL: real-clamd tests skipped in CI — clamav service not reachable'
            exit 1
          fi

      - name: Reconciliation suite
        working-directory: api
        run: php artisan reconcile:run

      - name: Web install
        working-directory: web
        run: npm ci

      - name: Web typecheck + build (i18n:check + bundle budget embedded)
        working-directory: web
        run: |
          npx tsc --noEmit
          npm run build

      - name: Compose config validates
        run: docker compose config -q
