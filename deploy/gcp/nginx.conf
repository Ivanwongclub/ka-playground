# KAP · Cloud Run web ingress. Serves the built SPA and proxies the API to the
# php-fpm SIDECAR at 127.0.0.1:9000 (same instance, shared localhost). The SPA
# calls RELATIVE /api → same-origin → no CORS, no baked API host (readiness §5).
#
# Decoupled from the API filesystem: every /api|/up|/horizon request is handed
# straight to Laravel's front controller via fastcgi (SCRIPT_FILENAME resolves on
# the php-fpm container, not here) — so this image carries only the SPA dist.
server {
    listen 8080;              # Cloud Run PORT (containerPort: 8080)
    server_name _;

    root /usr/share/nginx/html;   # the Vite build (web/dist)
    index index.html;
    client_max_body_size 20m;     # evidence uploads (matches the local conf)

    # SPA — client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Laravel API + health + Horizon dashboard → the php-fpm sidecar.
    location ~ ^/(api|up|horizon) {
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param REQUEST_URI     $request_uri;
        fastcgi_param QUERY_STRING    $query_string;
        fastcgi_read_timeout 60s;
    }
}
