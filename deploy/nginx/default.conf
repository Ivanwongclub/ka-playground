# KA Playground — local nginx: serves the built web app and proxies the Laravel API.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Web app (Vite build) — SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Laravel: API routes + /up health endpoint
    location ~ ^/(api|up|horizon) {
        root /var/www/api/public;
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        root /var/www/api/public;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
    }

    client_max_body_size 20m;
}
